<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digitalizador de Documentos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>📄 Digitalizador de Documentos</h1>

        <p class="descripcion">
            Selecciona el tamaño del documento que deseas digitalizar.
        </p>

        <div class="grupo-control">

            <label for="tamanoHoja">
                Tamaño del documento
            </label>

            <select id="tamanoHoja">

                <option value="carta">
                    Carta
                </option>

                <option value="a4">
                    A4
                </option>

                <option value="oficio">
                    Oficio
                </option>

            </select>

        </div>

        <button id="btnAbrirCamara">
            📷 Abrir cámara
        </button>

        <div id="mensajeExito" class="mensaje-exito oculto">

            ✓ Foto tomada con éxito

        </div>

        <div id="contenedorCamara" class="oculto">

            <video
                id="video"
                autoplay
                playsinline>
            </video>

            <canvas id="canvasDeteccion"></canvas>

        </div>

        <div id="controlesCamara" class="oculto">

            <div id="controlZoom" class="oculto">

                <label for="zoomCamara">
                    🔍 Zoom
                </label>

                <input
                    type="range"
                    id="zoomCamara"
                    min="1"
                    max="1"
                    step="0.1"
                    value="1">

                <span id="valorZoom">
                    1.0x
                </span>

            </div>

            <button id="btnCapturar">
                📸 Capturar documento
            </button>

        </div>

        <canvas
            id="canvas"
            class="oculto">
        </canvas>

        <div
            id="resultado"
            class="oculto">

            <h2>
                Vista previa
            </h2>

            <canvas
                id="canvasResultado">
            </canvas>

            <div class="botonesResultado">

                <button id="btnRepetir">
                    🔄 Tomar otra foto
                </button>

                <button id="btnConfirmar">
                    ✅ Confirmar documento
                </button>

            </div>

        </div>

    </div>

    <!-- OpenCV -->
    <script src="https://docs.opencv.org/4.x/opencv.js"></script>

    <!-- Nuestro JavaScript -->
    <script src="script.js"></script>

</body>

</html>
