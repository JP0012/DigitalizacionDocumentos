<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digitalizador de Documentos</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="contenedor">

        <h1>📄 Digitalizador de Documentos</h1>

        <p class="descripcion">
            Selecciona el tamaño del documento que deseas digitalizar.
        </p>


        <!-- ==========================================
             TAMAÑO DEL DOCUMENTO
        =========================================== -->

        <div class="grupo-control">

            <label for="tamanoHoja">
                Tamaño del documento
            </label>

            <select id="tamanoHoja">

                <option value="carta">
                    Carta
                </option>

                <option value="a4">
                    A4
                </option>

                <option value="oficio">
                    Oficio
                </option>

            </select>

        </div>


        <!-- ==========================================
             ABRIR CÁMARA
        =========================================== -->

        <button id="btnAbrirCamara">

            📷 Abrir cámara

        </button>


        <!-- ==========================================
             CÁMARA
        =========================================== -->

        <div id="contenedorCamara" class="oculto">

            <video
                id="video"
                autoplay
                playsinline>
            </video>

            <canvas id="canvasDeteccion"></canvas>

        </div>


        <!-- ==========================================
             CONTROLES DE CÁMARA
        =========================================== -->

        <div id="controlesCamara" class="oculto">


            <!-- ZOOM -->

            <div id="controlZoom" class="oculto">

                <label for="zoomCamara">
                    🔍 Zoom
                </label>

                <input
                    type="range"
                    id="zoomCamara"
                    min="1"
                    max="1"
                    step="0.1"
                    value="1">

                <span id="valorZoom">
                    1.0x
                </span>

            </div>


            <!-- CAPTURAR -->

            <button id="btnCapturar">

                📸 Capturar documento

            </button>

        </div>


        <!-- ==========================================
             CANVAS ORIGINAL
        =========================================== -->

        <canvas
            id="canvas"
            class="oculto">
        </canvas>


        <!-- ==========================================
             RESULTADO
        =========================================== -->

        <div
            id="resultado"
            class="oculto">

            <h2>
                Vista previa
            </h2>


            <canvas
                id="canvasResultado">
            </canvas>


            <div class="botonesResultado">

                <button id="btnRepetir">

                    🔄 Tomar otra foto

                </button>


                <button id="btnConfirmar">

                    ✅ Confirmar documento

                </button>

            </div>

        </div>

    </div>

         OPENCV
         
         NO ES INTELIGENCIA ARTIFICIAL.
         
         Se utiliza para:
         - detectar bordes
         - encontrar contornos
         - detectar las 4 esquinas
         - corregir perspectiva
    =========================================== -->

    <script src="https://docs.opencv.org/4.x/opencv.js"></script>
